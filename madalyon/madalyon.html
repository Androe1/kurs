/* Tek sahne, iki dünya: ufuk çizgisinin üstü aydınlık, altı karanlık. Sayfa bilerek tek görünümlü. */
:root{
  --night:#05060a;
  --ink:#1c1b21;
  --pearl:#eef0f4;
  --glow:rgba(255,246,226,.95);
  --serif:'Cinzel','Trajan Pro','Times New Roman',serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#horizon{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,var(--glow) 30%,#fff 50%,var(--glow) 70%,transparent 100%);
  box-shadow:0 0 18px 2px rgba(255,240,210,.55);transform:scaleX(0);opacity:0}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.28) 100%)}
.cap{position:absolute;margin:0;pointer-events:none;font-family:var(--serif);font-weight:400;
  letter-spacing:.24em;font-size:clamp(18px,2.3vw,46px);line-height:1;white-space:nowrap;opacity:0}
#capTop{color:var(--ink);left:max(16px,7vw);top:24%}
#capBot{color:var(--pearl);right:max(16px,7vw);top:72%;text-shadow:0 0 22px rgba(255,236,200,.35)}
@media (max-aspect-ratio:1/1){
  #capTop{left:0;right:0;text-align:center;top:8%}
  #capBot{left:0;right:0;text-align:center;top:auto;bottom:8%}
}
#replay{position:absolute;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  font:500 12px/1 system-ui,sans-serif;letter-spacing:.08em;color:var(--pearl);background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:9px 14px;cursor:pointer}
#replay:hover{background:rgba(255,255,255,.16)}
#replay:focus-visible{outline:2px solid #fff;outline-offset:2px}
.render #replay{display:none}
</style>

<div id="stage">
  <div id="horizon"></div>
  <div id="vignette"></div>
  <p class="cap" id="capTop">BİR MADALYONUN</p>
  <p class="cap" id="capBot">İKİ YÜZÜ</p>
  <button id="replay" type="button">Baştan oynat</button>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
const DUR = 11;            // animasyon süresi (sn)
const HOLD = 1.6;          // canlı döngüde sondaki bekleme
if (RENDER) document.documentElement.classList.add('render');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- yardımcılar ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const sm = x => x * x * (3 - 2 * x);
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);

/* ---------- renderer ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: RENDER });
renderer.setPixelRatio(RENDER ? +(Q.get('pr') || 1) : Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false;
stage.prepend(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

/* ---------- madalyon yüz dokuları (kodla çizilir) ---------- */
const S = 1536, R = S / 2;
const gray = v => { const c = Math.round(clamp(v) * 255); return `rgb(${c},${c},${c})`; };
const rm = (r, m) => `rgb(0,${Math.round(r * 255)},${Math.round(m * 255)})`;

function layers() {
  const o = {};
  for (const k of ['h', 'c', 'rm', 'e']) {
    const cv = document.createElement('canvas'); cv.width = cv.height = S;
    o[k] = { cv, x: cv.getContext('2d') };
  }
  return o;
}
function paint(L, fn) {
  for (const k in L) { const x = L[k].x; x.save(); x.translate(R, R); fn(x, k); x.restore(); }
}
const fsv = (x, v) => typeof v === 'function' ? v(x) : v;
function fillShape(L, style, path, rule) {
  paint(L, (x, k) => {
    if (style[k] === undefined) return;
    x.fillStyle = fsv(x, style[k]);
    const p = path(); x.fill(p, rule || 'nonzero');
  });
}
const circ = (cx, cy, r) => () => { const p = new Path2D(); p.arc(cx * R, cy * R, r * R, 0, Math.PI * 2); return p; };
const ringP = (r, w) => () => { const p = new Path2D(); p.arc(0, 0, (r + w / 2) * R, 0, Math.PI * 2); p.arc(0, 0, (r - w / 2) * R, 0, Math.PI * 2, true); return p; };
function star4(cx, cy, r, rot = 0) {
  return () => {
    const p = new Path2D();
    for (let i = 0; i < 8; i++) {
      const a = rot + i * Math.PI / 4, rr = (i % 2 ? r * .28 : r) * R;
      const X = cx * R + Math.cos(a) * rr, Y = cy * R + Math.sin(a) * rr;
      i ? p.lineTo(X, Y) : p.moveTo(X, Y);
    }
    p.closePath(); return p;
  };
}
const domeGrad = (cx, cy, r, hi, lo) => x => {
  const g = x.createRadialGradient(cx * R - r * R * .25, cy * R - r * R * .25, 0, cx * R, cy * R, r * R);
  g.addColorStop(0, gray(hi)); g.addColorStop(1, gray(lo)); return g;
};
function arcText(L, text, radius, size, top, style, track = .16) {
  paint(L, (x, k) => {
    if (style[k] === undefined) return;
    x.font = `600 ${size * R}px Cinzel, serif`;
    x.fillStyle = fsv(x, style[k]); x.textAlign = 'center'; x.textBaseline = 'middle';
    const r = radius * R, chars = [...text];
    const ws = chars.map(c => x.measureText(c).width + track * size * R);
    const tot = ws.reduce((a, b) => a + b, 0) - track * size * R;
    let cum = 0;
    chars.forEach((ch, i) => {
      const mid = cum + (ws[i] - track * size * R) / 2;
      const a = top ? -Math.PI / 2 - tot / r / 2 + mid / r : Math.PI / 2 + tot / r / 2 - mid / r;
      x.save(); x.translate(Math.cos(a) * r, Math.sin(a) * r);
      x.rotate(top ? a + Math.PI / 2 : a - Math.PI / 2);
      x.fillText(ch, 0, 0); x.restore();
      cum += ws[i];
    });
  });
}
function beads(L, n, r, br, style) {
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, cx = Math.cos(a) * r, cy = Math.sin(a) * r;
    fillShape(L, { ...style, h: domeGrad(cx, cy, br, .95, .62) }, circ(cx, cy, br));
  }
}
function heightToNormal(cv, strength) {
  const w = cv.width, h = cv.height;
  const blur = document.createElement('canvas'); blur.width = w; blur.height = h;
  const bx = blur.getContext('2d'); bx.filter = `blur(${w / 900}px)`; bx.drawImage(cv, 0, 0);
  const src = bx.getImageData(0, 0, w, h).data;
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const ox = out.getContext('2d'); const img = ox.createImageData(w, h); const d = img.data;
  const H = (x, y) => src[((Math.min(h - 1, Math.max(0, y)) * w) + Math.min(w - 1, Math.max(0, x))) * 4] / 255;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = (H(x + 1, y) - H(x - 1, y)) * strength;
    const dy = (H(x, y - 1) - H(x, y + 1)) * strength;

}

/* Ön yüz: aydınlık güneş; merkezinde karanlık bir tutulma */
function frontFace() {
  const L = layers();

  fillShape(L, field, () => { const p = new Path2D(); p.rect(-R, -R, S, S); return p; });
  // guilloş (gül motoru) oyması
  paint(L, (x, k) => {
    if (k !== 'h' && k !== 'c') return;
    x.strokeStyle = k === 'h' ? 'rgba(255,255,255,.12)' : 'rgba(120,86,30,.10)';
    x.lineWidth = S / 900;
    for (let r0 = .1; r0 < .64; r0 += .0125) {

      for (let i = 0; i <= 720; i++) {
        const a = i / 720 * Math.PI * 2, r = (r0 + .009 * Math.sin(16 * a + r0 * 38)) * R;

      }

  fillShape(L, { ...relief, c: '#f3dc9c', rm: rm(.34, 1), h: domeGrad(0, 0, .29, 1, .66) }, circ(0, 0, .29));

    c: x => { const g = x.createRadialGradient(-.05 * R, -.06 * R, 0, 0, 0, .19 * R); g.addColorStop(0, '#1b1c23'); g.addColorStop(1, '#050508'); return g; } },
    circ(0, 0, .19));
  fillShape(L, { h: gray(.95), c: '#fff0c4', rm: rm(.12, 1) }, ringP(.197, .014));
  fillShape(L, { h: gray(1), c: '#fffbe9', rm: rm(.1, 1), e: '#6a5426' }, circ(Math.cos(-.8) * .197, Math.sin(-.8) * .197, .024));
  // halkalar, yazı, boncuklar
  fillShape(L, { ...relief, h: gray(.78) }, ringP(.665, .012));
  fillShape(L, { ...relief, h: gray(.78) }, ringP(.855, .012));
  arcText(L, 'BİR MADALYONUN', .758, .105, true, { ...relief, h: gray(.86) });
  arcText(L, 'AYDINLIK', .758, .085, false, { ...relief, h: gray(.86) }, .3);
  fillShape(L, { ...relief, h: gray(.9) }, star4(-.758, 0, .035));

/* Arka yüz: karanlık hilal gecesi; kucağında aydınlık bir küre */
function backFace() {
  const L = layers();
  const field = { c: '#272b34', rm: rm(.44, .85), h: gray(.30), e: '#000' };
  const relief = { c: '#d2d7e1', rm: rm(.24, 1) };
  fillShape(L, field, () => { const p = new Path2D(); p.rect(-R, -R, S, S); return p; });
  // kumlama dokusu
  paint(L, (x, k) => {
    if (k !== 'h' && k !== 'c') return;
    seed = 5;
    for (let i = 0; i < 14000; i++) {
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * R;
      x.fillStyle = k === 'h' ? `rgba(255,255,255,${rnd() * .10})` : `rgba(${rnd() > .5 ? '255,255,255' : '0,0,0'},${rnd() * .06})`;
      x.fillRect(Math.cos(a) * r, Math.sin(a) * r, S / 700, S / 700);
    }
  });
  // yıldızlar
  seed = 23;
  const stars = [[-.18, -.52, .04], [.34, -.5, .03], [.5, -.26, .022], [-.44, .38, .025], [.36, .46, .035], [.1, .58, .02],
                 [-.08, .44, .018], [.56, .12, .02], [-.6, -.08, .018], [.18, -.36, .016], [-.36, -.42, .02]];
  for (const [sx, sy, sr] of stars) {
    fillShape(L, { ...relief, h: gray(.7) }, star4(sx, sy, sr, rnd()));
    fillShape(L, { ...relief, h: gray(.92) }, star4(sx, sy, sr * .55, 0));
  }
  // hilal (kademeli sırt)
  [[.5, .43, .62], [.485, .447, .78], [.468, .463, .93]].forEach(([ro, ri, hv]) => {
    paint(L, (x, k) => {
      const st = { ...relief, h: gray(hv) };
      if (st[k] === undefined) return;
      x.save(); const clip = new Path2D(); clip.rect(-R, -R, S, S); clip.arc(.13 * R, -.02 * R, ri * R, 0, Math.PI * 2);
      x.clip(clip, 'evenodd'); x.fillStyle = st[k]; x.fill(circ(-.05, 0, ro)()); x.restore();
    });
  });
  // kürenin ışınları ve küre: karanlığın içindeki aydınlık
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2;
    fillShape(L, { h: gray(.42), c: '#8d846e', e: '#5b4720', rm: rm(.3, .5) }, () => {
      const p = new Path2D(), w = .05;
      p.moveTo(.11 * R + Math.cos(a - w) * .18 * R, Math.sin(a - w) * .18 * R);
      p.lineTo(.11 * R + Math.cos(a) * (i % 2 ? .25 : .3) * R, Math.sin(a) * (i % 2 ? .25 : .3) * R);
      p.lineTo(.11 * R + Math.cos(a + w) * .18 * R, Math.sin(a + w) * .18 * R); p.closePath(); return p;
    });
  }
  fillShape(L, { h: gray(.2), c: '#14161b' }, circ(.11, 0, .158));
  fillShape(L, { h: domeGrad(.11, 0, .145, .8, .56), c: '#fff4dc', rm: rm(.3, 0),
    e: x => { const g = x.createRadialGradient(.11 * R, 0, 0, .11 * R, 0, .145 * R); g.addColorStop(0, '#fff6dc'); g.addColorStop(.75, '#ffd98a'); g.addColorStop(1, '#c98c3a'); return g; } },
    circ(.11, 0, .145));
  fillShape(L, { ...relief, h: gray(.78) }, ringP(.665, .012));
  fillShape(L, { ...relief, h: gray(.78) }, ringP(.855, .012));
  arcText(L, 'İKİ YÜZÜ', .758, .105, true, { ...relief, h: gray(.86) }, .34);
  arcText(L, 'KARANLIK', .758, .085, false, { ...relief, h: gray(.86) }, .3);
  fillShape(L, { ...relief, h: gray(.9) }, star4(-.758, 0, .035));
  fillShape(L, { ...relief, h: gray(.9) }, star4(.758, 0, .035));
  beads(L, 80, .925, .019, relief);
  return L;
}

    const t = mat[k]; if (!t) continue;
    if (!done.has(t)) { const c = t.clone(); c.repeat.set(1, -1); c.offset.set(0, 1); c.needsUpdate = true; done.set(t, c); }
    m[k] = done.get(t);

}

  const w = 2048, h = 64, cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d'), img = x.createImageData(w, h), d = img.data, N = 160;
  for (let yy = 0; yy < h; yy++) {
    const v = bandAtTop ? yy / h : 1 - yy / h;               // v: profilin ekvatordan uzaklığı
    const band = 1 - sm(clamp((v - .14) / .1));
    for (let xx = 0; xx < w; xx++) {
      const dh = Math.sin(xx / w * Math.PI * 2 * N) * 1.1 * band;
      const l = Math.hypot(dh, 1), i = (yy * w + xx) * 4;
      d[i] = (-dh / l * .5 + .5) * 255; d[i + 1] = 128; d[i + 2] = (1 / l * .5 + .5) * 255; d[i + 3] = 255;
    }

function points(n, gen, color, additive, sizeK) {

  const g = new THREE.BufferGeometry();

  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aPh', new THREE.BufferAttribute(ph, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    uniforms: { uTime: { value: 0 }, uFade: { value: 0 }, uPR: { value: renderer.getPixelRatio() }, uCol: { value: new THREE.Color(color) }, uK: { value: sizeK }, uRise: { value: 0 } },
    vertexShader: `attribute float aSize; attribute float aPh; uniform float uTime,uPR,uK,uFade,uRise; varying float vA;
      void main(){ vec3 p=position; p.y+=uRise*(0.25+aPh*0.5); p.x+=sin(uTime*.3+aPh*20.)*uRise*.08;
        vec4 mv=modelViewMatrix*vec4(p,1.); gl_Position=projectionMatrix*mv;

  stars.material.uniforms.uFade.value = sm(seg(t, 1.2, 3.4)); stars.material.uniforms.uTime.value = t;
  motes.material.uniforms.uFade.value = .4 * sm(seg(t, 1.6, 3.6)); motes.material.uniforms.uTime.value = t; motes.material.uniforms.uRise.value = t;
  mirrorMat.uniforms.uMed.value.set(0, 0, 0); mirrorMat.uniforms.uPool.value = sm(seg(t, 2.6, 4)) * (.8 + land * .8);

  // kamera: yavaş yaklaşma ve hafif yörünge (ufuk hep tam ortada)
  const k = eInOut(seg(t, 0, DUR));
  const fit = Math.max(1, 1.15 / camera.aspect);
  const dist = lerp(10.6, 9.0, k) * fit;
  const cx = lerp(1.1, -.7, k);
  camera.position.set(cx, CAM_Y, dist);
  camera.lookAt(cx * .25, CAM_Y, 0);
  camera.updateMatrixWorld();

  tmp.set(0, y, 0).project(camera); bgMat.uniforms.uSun.value.set(tmp.x * .5 + .5, tmp.y * .5 + .5);
  tmp.set(0, -y, 0).project(camera); bgMat.uniforms.uMoon.value.set(tmp.x * .5 + .5, tmp.y * .5 + .5);

  // yazılar
  const c1 = eOut(seg(t, 8.7, 9.9)), c2 = eOut(seg(t, 9.1, 10.3));
  $t.style.opacity = c1; $t.style.transform = `translateY(${(1 - c1) * -14}px)`; $t.style.filter = `blur(${(1 - c1) * 6}px)`;
  $b.style.opacity = c2; $b.style.transform = `translateY(${(1 - c2) * 14}px)`; $b.style.filter = `blur(${(1 - c2) * 6}px)`;

  // çizim: arka plan → karanlık dünya → ayna → aydınlık dünya
  renderer.clear();
  renderer.clippingPlanes = [];
  renderer.render(bgScene, bgCam);
  renderer.clearDepth();
  renderer.clippingPlanes = clipBot; renderer.render(sceneBot, camera);
  renderer.clippingPlanes = []; renderer.render(sceneMirror, camera);
  renderer.clippingPlanes = clipTop; renderer.render(sceneTop, camera);
}

window.DURATION = DUR;
window.renderAt = renderAt;
if (RENDER) {
  renderAt(parseFloat(Q.get('t') || '0'));
  window.__ready = true;
} else {
  let t0 = performance.now();
  document.getElementById('replay').addEventListener('click', () => { t0 = performance.now(); });
  const loop = now => {
    const t = reduced ? 9.6 : ((now - t0) / 1000) % (DUR + HOLD);
    renderAt(Math.min(t, DUR));
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
