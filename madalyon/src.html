<title>Madalyonun İki Yüzü</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:'Cinzel';font-weight:600;unicode-range:U+0100-024F,U+1E00-1EFF;src:url(data:font/woff2;base64,{{EXT600}}) format('woff2')}
@font-face{font-family:'Cinzel';font-weight:600;unicode-range:U+0000-00FF,U+2000-206F;src:url(data:font/woff2;base64,{{LAT600}}) format('woff2')}
@font-face{font-family:'Cinzel';font-weight:400;unicode-range:U+0100-024F,U+1E00-1EFF;src:url(data:font/woff2;base64,{{EXT400}}) format('woff2')}

/* Tek sahne, iki dünya: ufuk çizgisinin üstü aydınlık, altı karanlık. Sayfa bilerek tek görünümlü. */
:root{
  --night:#05060a;
  --ink:#1c1b21;
  --pearl:#eef0f4;
  --glow:rgba(255,246,226,.95);
  --serif:'Cinzel','Trajan Pro','Times New Roman',serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#horizon{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,var(--glow) 30%,#fff 50%,var(--glow) 70%,transparent 100%);
  box-shadow:0 0 18px 2px rgba(255,240,210,.55);transform:scaleX(0);opacity:0}
.cap{position:absolute;margin:0;pointer-events:none;font-family:var(--serif);font-weight:400;
  letter-spacing:.24em;font-size:clamp(18px,2.3vw,46px);line-height:1;white-space:nowrap;opacity:0}
#capTop{color:var(--ink);left:max(16px,7vw);top:24%}
#capBot{color:var(--pearl);right:max(16px,7vw);top:72%;text-shadow:0 0 22px rgba(255,236,200,.35)}
@media (max-aspect-ratio:1/1){
  #capTop{left:0;right:0;text-align:center;top:8%}
  #capBot{left:0;right:0;text-align:center;top:auto;bottom:8%}
}
#replay{position:absolute;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  font:500 12px/1 system-ui,sans-serif;letter-spacing:.08em;color:var(--pearl);background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:9px 14px;cursor:pointer}
#replay:hover{background:rgba(255,255,255,.16)}
#replay:focus-visible{outline:2px solid #fff;outline-offset:2px}
.render #replay{display:none}
</style>

<div id="stage">
  <div id="horizon"></div>
  <p class="cap" id="capTop">BİR MADALYONUN</p>
  <p class="cap" id="capBot">İKİ YÜZÜ</p>
  <button id="replay" type="button">Baştan oynat</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';

const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
const DUR = 11;            // animasyon süresi (sn)
const HOLD = 1.6;          // canlı döngüde sondaki bekleme
if (RENDER) document.documentElement.classList.add('render');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- yardımcılar ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const sm = x => x * x * (3 - 2 * x);
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);

/* ---------- renderer ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: RENDER });
renderer.setPixelRatio(RENDER ? +(Q.get('pr') || 1) : Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NoToneMapping;          // ton eşleme son geçişte yapılır (HDR → bloom → ton)
renderer.autoClear = false;
stage.prepend(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

/* ---------- madalyon yüz dokuları (kodla çizilir) ---------- */
const S = 1536, R = S / 2;
const gray = v => { const c = Math.round(clamp(v) * 255); return `rgb(${c},${c},${c})`; };
const rm = (r, m) => `rgb(0,${Math.round(r * 255)},${Math.round(m * 255)})`;

function layers() {
  const o = {};
  for (const k of ['h', 'c', 'rm', 'e']) {
    const cv = document.createElement('canvas'); cv.width = cv.height = S;
    o[k] = { cv, x: cv.getContext('2d') };
  }
  return o;
}
function paint(L, fn) {
  for (const k in L) { const x = L[k].x; x.save(); x.translate(R, R); fn(x, k); x.restore(); }
}
const fsv = (x, v) => typeof v === 'function' ? v(x) : v;
function fillShape(L, style, path, rule) {
  paint(L, (x, k) => {
    if (style[k] === undefined) return;
    x.fillStyle = fsv(x, style[k]);
    const p = path(); x.fill(p, rule || 'nonzero');
  });
}
const circ = (cx, cy, r) => () => { const p = new Path2D(); p.arc(cx * R, cy * R, r * R, 0, Math.PI * 2); return p; };
const ringP = (r, w) => () => { const p = new Path2D(); p.arc(0, 0, (r + w / 2) * R, 0, Math.PI * 2); p.arc(0, 0, (r - w / 2) * R, 0, Math.PI * 2, true); return p; };
function star4(cx, cy, r, rot = 0) {
  return () => {
    const p = new Path2D();
    for (let i = 0; i < 8; i++) {
      const a = rot + i * Math.PI / 4, rr = (i % 2 ? r * .28 : r) * R;
      const X = cx * R + Math.cos(a) * rr, Y = cy * R + Math.sin(a) * rr;
      i ? p.lineTo(X, Y) : p.moveTo(X, Y);
    }
    p.closePath(); return p;
  };
}
const domeGrad = (cx, cy, r, hi, lo) => x => {
  const g = x.createRadialGradient(cx * R - r * R * .25, cy * R - r * R * .25, 0, cx * R, cy * R, r * R);
  g.addColorStop(0, gray(hi)); g.addColorStop(1, gray(lo)); return g;
};
function arcText(L, text, radius, size, top, style, track = .16) {
  paint(L, (x, k) => {
    if (style[k] === undefined) return;
    x.font = `600 ${size * R}px Cinzel, serif`;
    x.fillStyle = fsv(x, style[k]); x.textAlign = 'center'; x.textBaseline = 'middle';
    const r = radius * R, chars = [...text];
    const ws = chars.map(c => x.measureText(c).width + track * size * R);
    const tot = ws.reduce((a, b) => a + b, 0) - track * size * R;
    let cum = 0;
    chars.forEach((ch, i) => {
      const mid = cum + (ws[i] - track * size * R) / 2;
      const a = top ? -Math.PI / 2 - tot / r / 2 + mid / r : Math.PI / 2 + tot / r / 2 - mid / r;
      x.save(); x.translate(Math.cos(a) * r, Math.sin(a) * r);
      x.rotate(top ? a + Math.PI / 2 : a - Math.PI / 2);
      x.fillText(ch, 0, 0); x.restore();
      cum += ws[i];
    });
  });
}
function beads(L, n, r, br, style) {
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, cx = Math.cos(a) * r, cy = Math.sin(a) * r;
    fillShape(L, { ...style, h: domeGrad(cx, cy, br, .95, .62) }, circ(cx, cy, br));
  }
}
function heightToNormal(cv, strength) {
  const w = cv.width, h = cv.height;
  const blur = document.createElement('canvas'); blur.width = w; blur.height = h;
  const bx = blur.getContext('2d'); bx.filter = `blur(${w / 900}px)`; bx.drawImage(cv, 0, 0);
  const src = bx.getImageData(0, 0, w, h).data;
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const ox = out.getContext('2d'); const img = ox.createImageData(w, h); const d = img.data;
  const H = (x, y) => src[((Math.min(h - 1, Math.max(0, y)) * w) + Math.min(w - 1, Math.max(0, x))) * 4] / 255;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = (H(x + 1, y) - H(x - 1, y)) * strength;
    const dy = (H(x, y - 1) - H(x, y + 1)) * strength;
    const l = Math.hypot(dx, dy, 1), i = (y * w + x) * 4;
    d[i] = (-dx / l * .5 + .5) * 255; d[i + 1] = (-dy / l * .5 + .5) * 255; d[i + 2] = (1 / l * .5 + .5) * 255; d[i + 3] = 255;
  }
  ox.putImageData(img, 0, 0); return out;
}

/* Ön yüz: aydınlık güneş; merkezinde karanlık bir tutulma */
function frontFace() {
  const L = layers();
  const field = { c: '#e4c682', rm: rm(.16, 1), h: gray(.30), e: '#000' };
  const relief = { c: '#f1d999', rm: rm(.42, 1) };
  fillShape(L, field, () => { const p = new Path2D(); p.rect(-R, -R, S, S); return p; });
  // guilloş (gül motoru) oyması
  paint(L, (x, k) => {
    if (k !== 'h' && k !== 'c') return;
    x.strokeStyle = k === 'h' ? 'rgba(255,255,255,.12)' : 'rgba(120,86,30,.10)';
    x.lineWidth = S / 900;
    for (let r0 = .1; r0 < .64; r0 += .0125) {
      x.beginPath();
      for (let i = 0; i <= 720; i++) {
        const a = i / 720 * Math.PI * 2, r = (r0 + .009 * Math.sin(16 * a + r0 * 38)) * R;
        i ? x.lineTo(Math.cos(a) * r, Math.sin(a) * r) : x.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      x.stroke();
    }
  });
  // güneş ışınları (sırtlı)
  for (let i = 0; i < 32; i++) {
    const a = i / 32 * Math.PI * 2 + Math.PI / 32, long = i % 2 === 0;
    const tip = long ? .63 : .52;
    [[1, .58], [.62, .76], [.3, .92]].forEach(([wf, hv]) => {
      fillShape(L, { ...relief, h: gray(hv) }, () => {
        const p = new Path2D(), w = Math.PI / 32 * .62 * wf;
        p.moveTo(Math.cos(a - w) * .3 * R, Math.sin(a - w) * .3 * R);
        p.lineTo(Math.cos(a) * tip * R, Math.sin(a) * tip * R);
        p.lineTo(Math.cos(a + w) * .3 * R, Math.sin(a + w) * .3 * R); p.closePath(); return p;
      });
    });
  }
  fillShape(L, { h: gray(.18), c: '#b8964f' }, circ(0, 0, .305));
  fillShape(L, { ...relief, c: '#f3dc9c', rm: rm(.34, 1), h: domeGrad(0, 0, .29, 1, .66) }, circ(0, 0, .29));
  // tutulma: aydınlığın içindeki karanlık
  fillShape(L, { h: gray(.5), rm: rm(.07, 0), e: '#000',
    c: x => { const g = x.createRadialGradient(-.05 * R, -.06 * R, 0, 0, 0, .19 * R); g.addColorStop(0, '#1b1c23'); g.addColorStop(1, '#050508'); return g; } },
    circ(0, 0, .19));
  fillShape(L, { h: gray(.95), c: '#fff0c4', rm: rm(.12, 1) }, ringP(.197, .014));
  fillShape(L, { h: gray(1), c: '#fffbe9', rm: rm(.1, 1), e: '#6a5426' }, circ(Math.cos(-.8) * .197, Math.sin(-.8) * .197, .024));
  // halkalar, yazı, boncuklar
  fillShape(L, { ...relief, h: gray(.78) }, ringP(.665, .012));
  fillShape(L, { ...relief, h: gray(.78) }, ringP(.855, .012));
  arcText(L, 'BİR MADALYONUN', .758, .105, true, { ...relief, h: gray(.86) });
  arcText(L, 'AYDINLIK', .758, .085, false, { ...relief, h: gray(.86) }, .3);
  fillShape(L, { ...relief, h: gray(.9) }, star4(-.758, 0, .035));
  fillShape(L, { ...relief, h: gray(.9) }, star4(.758, 0, .035));
  beads(L, 80, .925, .019, relief);
  return L;
}

/* Arka yüz: karanlık hilal gecesi; kucağında aydınlık bir küre */
function backFace() {
  const L = layers();
  const field = { c: '#272b34', rm: rm(.44, .85), h: gray(.30), e: '#000' };
  const relief = { c: '#d2d7e1', rm: rm(.24, 1) };
  fillShape(L, field, () => { const p = new Path2D(); p.rect(-R, -R, S, S); return p; });
  // kumlama dokusu
  paint(L, (x, k) => {
    if (k !== 'h' && k !== 'c') return;
    seed = 5;
    for (let i = 0; i < 14000; i++) {
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * R;
      x.fillStyle = k === 'h' ? `rgba(255,255,255,${rnd() * .10})` : `rgba(${rnd() > .5 ? '255,255,255' : '0,0,0'},${rnd() * .06})`;
      x.fillRect(Math.cos(a) * r, Math.sin(a) * r, S / 700, S / 700);
    }
  });
  // yıldızlar
  seed = 23;
  const stars = [[-.18, -.52, .04], [.34, -.5, .03], [.5, -.26, .022], [-.44, .38, .025], [.36, .46, .035], [.1, .58, .02],
                 [-.08, .44, .018], [.56, .12, .02], [-.6, -.08, .018], [.18, -.36, .016], [-.36, -.42, .02]];
  for (const [sx, sy, sr] of stars) {
    fillShape(L, { ...relief, h: gray(.7) }, star4(sx, sy, sr, rnd()));
    fillShape(L, { ...relief, h: gray(.92) }, star4(sx, sy, sr * .55, 0));
  }
  // hilal (kademeli sırt)
  [[.5, .43, .62], [.485, .447, .78], [.468, .463, .93]].forEach(([ro, ri, hv]) => {
    paint(L, (x, k) => {
      const st = { ...relief, h: gray(hv) };
      if (st[k] === undefined) return;
      x.save(); const clip = new Path2D(); clip.rect(-R, -R, S, S); clip.arc(.13 * R, -.02 * R, ri * R, 0, Math.PI * 2);
      x.clip(clip, 'evenodd'); x.fillStyle = st[k]; x.fill(circ(-.05, 0, ro)()); x.restore();
    });
  });
  // kürenin ışınları ve küre: karanlığın içindeki aydınlık
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2;
    fillShape(L, { h: gray(.42), c: '#8d846e', e: '#5b4720', rm: rm(.3, .5) }, () => {
      const p = new Path2D(), w = .05;
      p.moveTo(.11 * R + Math.cos(a - w) * .18 * R, Math.sin(a - w) * .18 * R);
      p.lineTo(.11 * R + Math.cos(a) * (i % 2 ? .25 : .3) * R, Math.sin(a) * (i % 2 ? .25 : .3) * R);
      p.lineTo(.11 * R + Math.cos(a + w) * .18 * R, Math.sin(a + w) * .18 * R); p.closePath(); return p;
    });
  }
  fillShape(L, { h: gray(.2), c: '#14161b' }, circ(.11, 0, .158));
  fillShape(L, { h: domeGrad(.11, 0, .145, .8, .56), c: '#fff4dc', rm: rm(.3, 0),
    e: x => { const g = x.createRadialGradient(.11 * R, 0, 0, .11 * R, 0, .145 * R); g.addColorStop(0, '#fff6dc'); g.addColorStop(.75, '#ffd98a'); g.addColorStop(1, '#c98c3a'); return g; } },
    circ(.11, 0, .145));
  fillShape(L, { ...relief, h: gray(.78) }, ringP(.665, .012));
  fillShape(L, { ...relief, h: gray(.78) }, ringP(.855, .012));
  arcText(L, 'İKİ YÜZÜ', .758, .105, true, { ...relief, h: gray(.86) }, .34);
  arcText(L, 'KARANLIK', .758, .085, false, { ...relief, h: gray(.86) }, .3);
  fillShape(L, { ...relief, h: gray(.9) }, star4(-.758, 0, .035));
  fillShape(L, { ...relief, h: gray(.9) }, star4(.758, 0, .035));
  beads(L, 80, .925, .019, relief);
  return L;
}

function tex(cv, srgb) {
  const t = new THREE.CanvasTexture(cv);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso; return t;
}
function faceMaterial(L, nStrength) {
  const rmT = tex(L.rm.cv);
  return new THREE.MeshPhysicalMaterial({
    map: tex(L.c.cv, true), roughnessMap: rmT, metalnessMap: rmT, roughness: 1, metalness: 1,
    normalMap: tex(heightToNormal(L.h.cv, nStrength)), normalScale: new THREE.Vector2(1, 1),
    emissiveMap: tex(L.e.cv, true), emissive: 0xffffff, emissiveIntensity: 1,
    clearcoat: .1, clearcoatRoughness: .3,
  });
}
// aynadaki kopya için dikey çevrilmiş dokular (yazı okunur kalsın)
function flipped(mat) {
  const m = mat.clone(), done = new Map();
  for (const k of ['map', 'roughnessMap', 'metalnessMap', 'normalMap', 'emissiveMap']) {
    const t = mat[k]; if (!t) continue;
    if (!done.has(t)) { const c = t.clone(); c.repeat.set(1, -1); c.offset.set(0, 1); c.needsUpdate = true; done.set(t, c); }
    m[k] = done.get(t);
  }
  return m;
}
function reedMaterial(color, rough, metal, bandAtTop) {
  const w = 2048, h = 64, cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d'), img = x.createImageData(w, h), d = img.data, N = 160;
  for (let yy = 0; yy < h; yy++) {
    const v = bandAtTop ? yy / h : 1 - yy / h;               // v: profilin ekvatordan uzaklığı
    const band = 1 - sm(clamp((v - .14) / .1));
    for (let xx = 0; xx < w; xx++) {
      const dh = Math.sin(xx / w * Math.PI * 2 * N) * 1.1 * band;
      const l = Math.hypot(dh, 1), i = (yy * w + xx) * 4;
      d[i] = (-dh / l * .5 + .5) * 255; d[i + 1] = 128; d[i + 2] = (1 / l * .5 + .5) * 255; d[i + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0);
  return new THREE.MeshPhysicalMaterial({ color, roughness: rough, metalness: metal, normalMap: tex(cv), clearcoat: .2 });
}

/* ---------- madalyon geometrisi ---------- */
const FACE_R = .86, FACE_Z = .06;
const prof = [[1, 0], [.999, .02], [.996, .04], [.99, .056], [.98, .068], [.965, .077], [.945, .082], [.92, .084],
              [.895, .083], [.878, .079], [.868, .072], [.861, .065], [.855, .06]];
const latheF = new THREE.LatheGeometry(prof.map(([r, h]) => new THREE.Vector2(r, h)), 256).rotateX(Math.PI / 2);
const latheB = new THREE.LatheGeometry(prof.map(([r, h]) => new THREE.Vector2(r, -h)).reverse(), 256).rotateX(Math.PI / 2);
const faceGeo = new THREE.CircleGeometry(FACE_R + .002, 160);
const faceGeoF = faceGeo.clone().translate(0, 0, FACE_Z);
const faceGeoB = faceGeo.clone().rotateY(Math.PI).translate(0, 0, -FACE_Z);

function buildMedallion(m) {
  const outer = new THREE.Group(), inner = new THREE.Group();
  inner.rotation.order = 'YXZ';
  outer.add(inner);
  inner.add(new THREE.Mesh(latheF, m.rimF), new THREE.Mesh(latheB, m.rimB),
            new THREE.Mesh(faceGeoF, m.faceF), new THREE.Mesh(faceGeoB, m.faceB));
  return { outer, inner };
}

/* ---------- ortamlar ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
const envTop = pmrem.fromScene(new RoomEnvironment(renderer), .03).texture;
function darkEnv() {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(12, 12, 12), new THREE.MeshBasicMaterial({ color: 0x020307, side: THREE.BackSide })));
  const panel = (w, h, col, k, pos) => {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide }));
    mesh.position.set(...pos); mesh.lookAt(0, 0, 0); s.add(mesh);
  };
  panel(7, .7, 0x9fb6ff, 3.2, [0, -5, 1.5]);
  panel(.6, 5, 0x7f98ff, 2.0, [-5.5, -.5, 1.5]);
  panel(.5, 3.5, 0xffc68a, 1.4, [5.5, -1, 2.5]);
  panel(5, 5, 0x22304f, .9, [0, 0, 5.8]);
  return pmrem.fromScene(s, .04).texture;
}
const envBot = darkEnv();

/* ---------- sahneler ---------- */
const sceneTop = new THREE.Scene(); sceneTop.environment = envTop;
const sceneBot = new THREE.Scene(); sceneBot.environment = envBot;

await document.fonts.load('600 80px Cinzel', 'BİRÜKŞ');
await document.fonts.load('400 40px Cinzel', 'BİRÜKŞ');
const FL = frontFace(), BL = backFace();
const mFaceF = faceMaterial(FL, 7), mFaceB = faceMaterial(BL, 7);
const rimGold = reedMaterial(0xe0c07a, .26, 1, false), rimDark = reedMaterial(0x30343e, .32, .9, true);

const top = buildMedallion({ faceF: mFaceF, faceB: mFaceB, rimF: rimGold, rimB: rimDark });
sceneTop.add(top.outer);
// aynadaki madalyon: yüzler yer değiştirir, öndeki yüz arka yüzü gösterir
const mirF = flipped(mFaceB), mirB = flipped(mFaceF);
const bot = buildMedallion({ faceF: mirF, faceB: mirB, rimF: rimDark, rimB: rimGold });
bot.outer.scale.y = -1;
sceneBot.add(bot.outer);

/* ---------- ışık düzeni ----------
   Aydınlık dünya: sıcak anahtar ışık (yüzeyde gezer), arkadan sıcak kontur, soğuk dolgu.
   Karanlık dünya: arkadan soğuk ay konturu, zayıf ay anahtarı, kürenin kendi sıcak ışığı. */
const keyTop = new THREE.DirectionalLight(0xfff0d8, 2.4); keyTop.position.set(-3, 5, 6);
const fillTop = new THREE.DirectionalLight(0xdfe8ff, .55); fillTop.position.set(5, .5, 3);
const backTop = new THREE.DirectionalLight(0xfff4e2, 3.2); backTop.position.set(1.5, 4, -6);
sceneTop.add(keyTop, fillTop, backTop, new THREE.HemisphereLight(0xffffff, 0xd9cdb4, .3));
const rimBot = new THREE.DirectionalLight(0x8ea8ff, 4.2); rimBot.position.set(-3, -3, -5);
const rimBot2 = new THREE.DirectionalLight(0x6f86ff, 2.0); rimBot2.position.set(4, -1.5, -4);
const keyBot = new THREE.DirectionalLight(0xb8c8ff, .7); keyBot.position.set(3, -1, 5);
sceneBot.add(rimBot, rimBot2, keyBot);
const orbLight = new THREE.PointLight(0xffc77a, 2, 2.4, 2);
orbLight.position.set(.11 * FACE_R, 0, .3);
bot.inner.add(orbLight);

// küre parıltısı (bloom'u destekleyen yumuşak hale)
function glowTexture() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const x = cv.getContext('2d'), g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,244,214,1)'); g.addColorStop(.18, 'rgba(255,214,140,.5)');
  g.addColorStop(.5, 'rgba(255,170,80,.1)'); g.addColorStop(1, 'rgba(255,150,60,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256); return tex(cv, true);
}
const orbGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
orbGlow.position.set(.11 * FACE_R, 0, .1); orbGlow.scale.setScalar(.9);
bot.inner.add(orbGlow);

// karanlık dünyada yıldızlar, aydınlık dünyada koyu toz zerreleri
function points(n, gen, color, additive, sizeK, gain) {
  const pos = new Float32Array(n * 3), size = new Float32Array(n), ph = new Float32Array(n);
  for (let i = 0; i < n; i++) { const p = gen(); pos.set(p.slice(0, 3), i * 3); size[i] = p[3]; ph[i] = rnd(); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aPh', new THREE.BufferAttribute(ph, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    uniforms: { uTime: { value: 0 }, uFade: { value: 0 }, uPR: { value: 1 }, uCol: { value: new THREE.Color(color).multiplyScalar(gain) }, uK: { value: sizeK }, uRise: { value: 0 } },
    vertexShader: `attribute float aSize; attribute float aPh; uniform float uTime,uPR,uK,uFade,uRise; varying float vA;
      void main(){ vec3 p=position; p.y+=uRise*(0.25+aPh*0.5); p.x+=sin(uTime*.3+aPh*20.)*uRise*.08;
        vec4 mv=modelViewMatrix*vec4(p,1.); gl_Position=projectionMatrix*mv;
        gl_PointSize=aSize*uPR*uK/-mv.z; vA=uFade*(.55+.45*sin(uTime*(1.2+aPh*2.)+aPh*30.)); }`,
    fragmentShader: `uniform vec3 uCol; varying float vA;
      void main(){ float d=length(gl_PointCoord-.5); float a=pow(smoothstep(.5,0.,d),2.2); gl_FragColor=vec4(uCol,a*vA); }`,
  });
  return new THREE.Points(g, mat);
}
seed = 99;
const stars = points(900, () => [(rnd() - .5) * 90, -.2 - Math.pow(rnd(), 1.4) * 22, -14 - rnd() * 50, 1.5 + Math.pow(rnd(), 6) * 7], 0xfff4e0, true, 60, 2.2);
sceneBot.add(stars);
const motes = points(140, () => [(rnd() - .5) * 14, .3 + rnd() * 5, -8 + rnd() * 9, 1.4 + rnd() * 2.6], 0x2a2930, false, 30, 1);
sceneTop.add(motes);

// ayna yüzeyi: Fresnel'e göre koyulaşan cam, madalyon yaklaşınca altında ışık havuzu
const mirrorMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uPool: { value: 0 } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `varying vec3 vW; uniform float uPool;
    void main(){ vec3 v=normalize(cameraPosition-vW); float fres=pow(1.-abs(v.y),5.);
      float d=length(vW.xz); float pool=exp(-d*d*.7)*uPool; float fade=exp(-length(vW-cameraPosition)*.025);
      vec3 c=vec3(1.,.88,.7)*pool*1.4+vec3(.5,.62,1.)*.06;
      gl_FragColor=vec4(c,clamp((pool*.5+.18*(1.-fres))*fade,0.,1.)); }`,
});
const mirror = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2), mirrorMat);
const sceneMirror = new THREE.Scene(); sceneMirror.add(mirror);

// arka plan: tasarım renkleri ekran rengi olarak yazılır, ton eşlemenin tersinden geçirilip doğrusal HDR'a çevrilir
const EXPOSURE = 1.5;
const TONEMAP_GLSL = `
  vec3 tm(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
  vec3 invTm(vec3 y){ y=clamp(y,0.,.985); vec3 A=2.43*y-2.51, B=.59*y-.03, C=.14*y;
    return (-B-sqrt(max(B*B-4.*A*C,0.)))/(2.*A); }`;
const bgMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: { uTop: { value: 0 }, uBot: { value: 0 }, uAsp: { value: 1 }, uFlash: { value: 0 },
              uSun: { value: new THREE.Vector2(.5, .7) }, uMoon: { value: new THREE.Vector2(.5, .3) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `varying vec2 vUv; uniform float uTop,uBot,uAsp,uFlash; uniform vec2 uSun,uMoon; ${TONEMAP_GLSL}
    void main(){ vec2 uv=vUv, A=vec2(uAsp,1.); vec3 col;
      if(uv.y>=.5){ float k=(uv.y-.5)*2.;
        col=mix(vec3(.975,.958,.925),vec3(.78,.81,.86),pow(k,.75));
        float d=length((uv-uSun)*A); col+=vec3(1.,.94,.82)*.18*exp(-d*d*7.);
        col=mix(vec3(0.),col,uTop);
      } else { float k=(.5-uv.y)*2.;
        col=mix(vec3(.07,.085,.135),vec3(.006,.008,.014),pow(k,.5));
        float d=length((uv-uMoon)*A); col+=vec3(.28,.36,.62)*.15*exp(-d*d*6.);
        col*=uBot; }
      vec3 lin=invTm(pow(clamp(col,0.,1.),vec3(2.2)))/${EXPOSURE.toFixed(3)};
      float hb=exp(-abs(uv.y-.5)*(uAsp*700.)); lin+=vec3(1.,.9,.75)*hb*(uFlash*14.+uBot*.4);
      gl_FragColor=vec4(lin,1.); }`,
});
const bgScene = new THREE.Scene();
const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat); bgQuad.frustumCulled = false; bgScene.add(bgQuad);
const bgCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

/* ---------- post: HDR hedef → bloom → alt-kare birikimi (hareket bulanıklığı + AA) → ton eşleme ---------- */
const rtOpts = { type: THREE.HalfFloatType, depthBuffer: true };
const rtScene = new THREE.WebGLRenderTarget(4, 4, { ...rtOpts, samples: 4 });
const rtAcc = new THREE.WebGLRenderTarget(4, 4, { type: THREE.FloatType, depthBuffer: false });
const bloom = new UnrealBloomPass(new THREE.Vector2(4, 4), .5, .45, 7.5);
const accQuad = new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: null }, uW: { value: 1 } }, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, transparent: true,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `uniform sampler2D tSrc; uniform float uW; varying vec2 vUv; void main(){ gl_FragColor=vec4(texture2D(tSrc,vUv).rgb*uW,1.); }`,
}));
const finalQuad = new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms: { tAcc: { value: null }, uTime: { value: 0 }, uAsp: { value: 1 }, uExp: { value: EXPOSURE } }, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `uniform sampler2D tAcc; uniform float uTime,uAsp,uExp; varying vec2 vUv; ${TONEMAP_GLSL}
    float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    vec3 srgb(vec3 c){ return mix(c*12.92,1.055*pow(c,vec3(1./2.4))-.055,step(.0031308,c)); }
    void main(){ vec2 c=vUv-.5; float r2=dot(c*vec2(uAsp,1.),c*vec2(uAsp,1.));
      vec2 ca=c*.0016*r2*4.;                                     // kenarlarda çok hafif renk sapması
      vec3 col=vec3(texture2D(tAcc,vUv+ca).r,texture2D(tAcc,vUv).g,texture2D(tAcc,vUv-ca).b)*uExp;
      col=tm(col);
      col*=mix(1.,.78,smoothstep(.25,1.4,r2));                   // vinyet
      col=srgb(col);
      col+=(hash(vUv*vec2(1931.,1117.)+fract(uTime*7.3))-.5)*(3./255.);   // film greni
      gl_FragColor=vec4(col,1.); }`,
}));

/* ---------- kamera ---------- */
const camera = new THREE.PerspectiveCamera(30, 16 / 9, .1, 200);
const CAM_Y = .1;
const clipTop = [new THREE.Plane(new THREE.Vector3(0, 1, 0), 0)];
const clipBot = [new THREE.Plane(new THREE.Vector3(0, -1, 0), 0)];
let W = 1, H = 1;
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight, pr = renderer.getPixelRatio();
  renderer.setSize(w, h, false);
  W = Math.round(w * pr); H = Math.round(h * pr);
  rtScene.setSize(W, H); rtAcc.setSize(W, H); bloom.setSize(W, H);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  bgMat.uniforms.uAsp.value = finalQuad.material.uniforms.uAsp.value = w / h;
  stars.material.uniforms.uPR.value = motes.material.uniforms.uPR.value = pr;
}
addEventListener('resize', resize); resize();

/* ---------- fizik ----------
   Düşüş: yerçekimiyle serbest düşüş, sonra aynanın "kaldırma alanı" onu sönümlü bir yay gibi yakalar.
   Dönüş: açısal hız sürtünmeyle üstel olarak söner; hızla orantılı bir presesyon yalpası eşlik eder.
   Çevirmeler: hedef açıya yay ile gider (hafif aşım + oturma); açısal hız madalyonu hafifçe kaldırır,
   açısal ivme ise eylemsizlikle ters yöne yatırır. Hepsi t'nin saf fonksiyonu: her kare yeniden üretilebilir. */
const G = 5.5, Y0 = 4.8, Y_CATCH = 2.1, HOVER_Y = 1.16, T_DROP = 1.1;
const T_FALL = Math.sqrt(2 * (Y0 - Y_CATCH) / G), V_CATCH = G * T_FALL;
const SPR_W = 7, SPR_Z = .65;
function spring(x0, v0, w, z, tau) {
  const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * tau);
  return e * (x0 * Math.cos(wd * tau) + (v0 + z * w * x0) / wd * Math.sin(wd * tau));
}
const stepResp = (tau, w, z) => tau <= 0 ? 0 : 1 - spring(1, 0, w, z, tau);
function dropY(t) {
  const tau = t - T_DROP;
  if (tau <= 0) return Y0;
  if (tau < T_FALL) return Y0 - .5 * G * tau * tau;
  return HOVER_Y + spring(Y_CATCH - HOVER_Y, -V_CATCH, SPR_W, SPR_Z, tau - T_FALL);
}
// en yakın yaklaşma anı (iniş parlaması bu ana bağlanır)
let T_LAND = T_DROP + T_FALL, minY = 9;
for (let t = T_DROP + T_FALL; t < T_DROP + T_FALL + 1.5; t += .002) { const y = dropY(t); if (y < minY) { minY = y; T_LAND = t; } }

const REST = .42, SPIN = Math.PI * 4, SPIN_K = 1.35;
const FLIPS = [5.3, 7.35], FLIP_W = 4.4, FLIP_Z = .62;
const flipAngle = t => FLIPS.reduce((a, tf) => a + Math.PI * stepResp(t - tf, FLIP_W, FLIP_Z), 0);
const d1 = (f, t, h = 1 / 240) => (f(t + h) - f(t - h)) / (2 * h);
const flipPeak = Math.PI * FLIP_W * 1.1;

function medallionState(t) {
  const tau = Math.max(0, t - T_DROP);
  const idle = sm(seg(t, T_LAND, T_LAND + 1.2));
  let y = dropY(t)
    + (Math.sin(t * 1.31) * .028 + Math.sin(t * 2.87 + 1.3) * .012) * idle;   // süzülme: uyumsuz frekanslar, tekrar etmeyen nefes
  const flipV = d1(flipAngle, t), flipA = d1(tt => d1(flipAngle, tt), t);
  y += .14 * Math.min(1, Math.abs(flipV) / flipPeak);                        // dönerken hafif yükselme
  const wob = .32 * Math.exp(-1.5 * tau) * (t > T_DROP ? 1 : 0);
  const yaw = REST - SPIN * Math.exp(-SPIN_K * tau) + flipAngle(t) + Math.sin(t * .71) * .05 * idle;
  const rx = -.07 + wob * Math.sin(7.2 * tau) + Math.sin(t * .93 + 2) * .018 * idle;
  const rz = .075 + wob * .8 * Math.cos(7.2 * tau) - clamp(flipA / 260, -.09, .09);
  return { y, yaw, rx, rz };
}

/* ---------- zaman çizelgesi ---------- */
const $h = document.getElementById('horizon'), $t = document.getElementById('capTop'), $b = document.getElementById('capBot');
const tmp = new THREE.Vector3();

function updateScene(t) {
  const land = Math.exp(-Math.pow((t - T_LAND) * 4, 2));
  const line = eOut(seg(t, .25, 1.5));
  const dawn = sm(seg(t, .9, 3.0)), dusk = sm(seg(t, .7, 2.6));
  bgMat.uniforms.uTop.value = dawn; bgMat.uniforms.uBot.value = dusk;
  bgMat.uniforms.uFlash.value = land * .9 + (1 - seg(t, .25, 1.8)) * line * .7;

  const s = medallionState(t);
  top.outer.position.set(0, s.y, 0);
  top.inner.rotation.set(s.rx, s.yaw, s.rz);
  bot.outer.position.set(0, -s.y, 0);
  bot.inner.rotation.copy(top.inner.rotation);
  top.outer.updateMatrixWorld(); bot.outer.updateMatrixWorld();

  const pulse = .85 + .15 * Math.sin(t * 2.4);
  const facing = Math.pow(Math.max(0, Math.cos(s.yaw)), 1.5);       // küre kameraya bakmıyorsa ışığı söner
  const glow = (1 + 6.5 * sm(seg(t, T_LAND - .4, T_LAND + 1.4))) * pulse;
  mirF.emissiveIntensity = glow; mFaceB.emissiveIntensity = glow * .9;
  mirB.emissiveIntensity = mFaceF.emissiveIntensity = 4 + land * 10;
  orbLight.intensity = .5 * glow;
  orbGlow.material.opacity = .25 * sm(seg(t, T_LAND - .3, T_LAND + 1.4)) * pulse * facing;
  orbGlow.scale.setScalar(.85 + .1 * Math.sin(t * 2.4));
  keyTop.position.set(-4 + Math.sin(t * .45) * 3.5, 5, 6);   // stüdyo ışığı yüzeyde gezer: parlama madalyonun üstünden akar
  backTop.intensity = 3.2 * dawn; rimBot.intensity = 4.2 * dusk;
  stars.material.uniforms.uFade.value = sm(seg(t, 1.2, 3.4)); stars.material.uniforms.uTime.value = t;
  motes.material.uniforms.uFade.value = .4 * sm(seg(t, 1.6, 3.6)); motes.material.uniforms.uTime.value = t; motes.material.uniforms.uRise.value = t;
  mirrorMat.uniforms.uPool.value = clamp(1.6 - s.y, 0, 1) * .7 + land * .8;   // madalyon aynaya yaklaştıkça altı aydınlanır

  // kamera: yavaş dolly + yörünge, inişte çok hafif sarsıntı; bakış hep yatay, ufuk hep tam ortada
  const k = eInOut(seg(t, 0, DUR));
  const fit = Math.max(1, 1.15 / camera.aspect);
  const dist = lerp(11.2, 9.2, k) * fit;
  const cx = lerp(1.3, -.8, k);
  const lt = t - T_LAND, shake = lt > 0 ? .012 * Math.exp(-5 * lt) * Math.sin(lt * 38) : 0;
  camera.position.set(cx, CAM_Y + shake, dist);
  camera.lookAt(cx * .25, CAM_Y + shake, 0);
  camera.updateMatrixWorld();

  tmp.set(0, s.y, 0).project(camera); bgMat.uniforms.uSun.value.set(tmp.x * .5 + .5, tmp.y * .5 + .5);
  tmp.set(0, -s.y, 0).project(camera); bgMat.uniforms.uMoon.value.set(tmp.x * .5 + .5, tmp.y * .5 + .5);
  return { line, land };
}

function drawSubframe() {
  renderer.setRenderTarget(rtScene);
  renderer.clear();
  renderer.clippingPlanes = [];
  renderer.render(bgScene, bgCam);
  renderer.clearDepth();
  renderer.clippingPlanes = clipBot; renderer.render(sceneBot, camera);
  renderer.clippingPlanes = []; renderer.render(sceneMirror, camera);
  renderer.clippingPlanes = clipTop; renderer.render(sceneTop, camera);
  renderer.clippingPlanes = [];
  bloom.render(renderer, null, rtScene, 0, false);
}

const halton = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
const FPS = 60, SHUTTER = .5;            // 180° obtüratör
let SUB = RENDER ? +(Q.get('sub') || 8) : 1;

function renderAt(t) {
  renderer.setRenderTarget(rtAcc); renderer.setClearColor(0x000000, 0); renderer.clear();
  for (let i = 0; i < SUB; i++) {
    const ts = SUB > 1 ? t + ((i + .5) / SUB - .5) * SHUTTER / FPS : t;
    updateScene(Math.max(0, ts));
    if (SUB > 1) camera.setViewOffset(W, H, halton(i + 1, 2) - .5, halton(i + 1, 3) - .5, W, H);
    drawSubframe();
    camera.clearViewOffset();
    renderer.setRenderTarget(rtAcc);
    accQuad.material.uniforms.tSrc.value = rtScene.texture; accQuad.material.uniforms.uW.value = 1 / SUB;
    accQuad.render(renderer);
  }
  const { line, land } = updateScene(t);
  renderer.setRenderTarget(null);
  finalQuad.material.uniforms.tAcc.value = rtAcc.texture; finalQuad.material.uniforms.uTime.value = t;
  finalQuad.render(renderer);

  $h.style.transform = `scaleX(${line})`; $h.style.opacity = Math.min(1, line * 1.4) * (.6 + .4 * land);
  const c1 = eOut(seg(t, 8.7, 9.9)), c2 = eOut(seg(t, 9.1, 10.3));
  $t.style.opacity = c1; $t.style.transform = `translateY(${(1 - c1) * -14}px)`; $t.style.filter = `blur(${(1 - c1) * 6}px)`;
  $b.style.opacity = c2; $b.style.transform = `translateY(${(1 - c2) * 14}px)`; $b.style.filter = `blur(${(1 - c2) * 6}px)`;
}

window.DURATION = DUR;
window.renderAt = renderAt;
if (RENDER) {
  renderAt(parseFloat(Q.get('t') || '0'));
  window.__ready = true;
} else {
  let t0 = performance.now();
  document.getElementById('replay').addEventListener('click', () => { t0 = performance.now(); });
  const loop = now => {
    const t = reduced ? 9.6 : ((now - t0) / 1000) % (DUR + HOLD);
    renderAt(Math.min(t, DUR));
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
